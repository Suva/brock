[package]
name = "brock"
version = "0.6.1"
description = "Brock: mind maps of maps inside maps, saved as you go"
authors = ["Jaan Pullerits"]
license = "GPL-3.0-or-later"
edition = "2024"

[lib]
# The `_lib` suffix keeps the library's name apart from the program's, which
# Cargo needs on Windows (https://github.com/rust-lang/cargo/issues/8519).
name = "brock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "bundled" builds SQLite into the app, with FTS5, so it is the same version
# on every system.
rusqlite = { version = "0.40", features = ["bundled"] }
# The secret agents knock with (see agent.rs); already part of Tauri's tree.
getrandom = "0.3"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
# The app's own updates, from the newest release, and the restart after one.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
