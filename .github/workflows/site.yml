# Builds the website and puts it on GitHub Pages (brock.clysuva.com).
name: Website

on:
  push:
    branches: [main]
    paths:
      - site/**
      - scripts/build-site.mjs
      - src/**
      - static/**
      - brand/**
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The downloads are those of the newest published release, not of the
      # version in package.json, whose installers may still be building.
      - name: Find the newest release
        run: |
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          [ -n "$tag" ] && echo "SITE_VERSION=${tag#v}" >> "$GITHUB_ENV"
          echo "Linking to: ${tag:-package.json's version}"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
